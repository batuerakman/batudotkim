name: batu
description: "portfolio"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  url_launcher: ^6.3.0
  audioplayers: ^6.1.0
  provider: ^6.1.2
  http: ^1.3.0
  html: ^0.15.5
  video_player: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  build_web_compilers: ^4.0.4


flutter:
  assets:
  - assets/bentoPenguinAvatar.png
  - assets/icons/g.png
  - assets/icons/linkedin.png
  - assets/icons/dribbble.png
  - assets/icons/buttonA.png
  - assets/icons/pinIcon.png
  - assets/icons/discIcon.png
  - assets/icons/mail.png
  - assets/icons/person.png
  - assets/icons/xbox.png
  - assets/icons/steam.png
  - assets/icons/discord.png
  - assets/projects/tomodoro.mp4
  - assets/home/githubBg.png
  - assets/home/gokuNukuBg.png
  - assets/home/spotifyBg.png
  - assets/sounds/hover.wav
  - assets/sounds/click.wav
  - assets/icons/mal.png
  - assets/icons/backtothefuture.png
  - assets/icons/letterboxd.png
  
  fonts:
    - family: SegoeUI
      fonts: 
        - asset: assets/fonts/Segoe-UI-Regular.ttf
        - asset: assets/fonts/Segoe-UI-Bold.ttf
        - asset: assets/fonts/Segoe-UI-Light.ttf

  uses-material-design: true